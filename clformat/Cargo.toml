[package]
name = "clformat"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["std"]
# Enables the `std`-only pieces of the generated code (currently just the
# `std::io::Write` adapter used by the `t` (stdout) output form).
std = []

[dependencies]
clformat-macro = { path = "../clformat-macro" }
